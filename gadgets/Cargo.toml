# =========================================================
# Torchsnap WASM Gadget Workspace
#
# A virtual Cargo workspace that owns every in-tree WASM
# gadget plus the shared `torchsnap-gadget-sdk` crate. The
# workspace is deliberately separate from `src-tauri/` —
# gadgets target `wasm32-wasip2`, the host targets the
# native triple, and the two toolchains should not share a
# lockfile or build directory.
#
# WIT test fixtures under `src-tauri/tests/fixtures/`
# intentionally remain outside this workspace: they are
# standalone crates used to exercise edge cases of the host
# loader and must be buildable in isolation.
# =========================================================

[workspace]
members = [
    "gadget-sdk",
    "hello-world",
    "calculator",
    "bangs",
    "emoji-picker",
    "open-url",
    "template",
    "zerotier",
]
resolver = "3"

# =========================================================
# Release profile (shared by every gadget)
#
# See `gadgets/hello-world/src/lib.rs` or the retired per-
# crate blocks for the trade-off rationale behind each
# setting. The short version:
#
# - `opt-level = 3`    — optimise for speed on the search
#                        hot path.
# - `lto = "fat"`      — cross-crate inlining across
#                        wit-bindgen / plugin code.
# - `codegen-units = 1` — required for `lto = "fat"` to
#                        inline across compilation units.
# - `panic = "abort"`  — strips unwind tables; wasmtime
#                        traps panics regardless.
# =========================================================
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
