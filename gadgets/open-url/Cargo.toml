[package]
name = "open-url-gadget"
version = "0.1.0"
edition = "2024"

# This crate targets wasm32-wasip2 and is built with
# `cargo build --target wasm32-wasip2`, not the host target.

[dependencies]
torchsnap-gadget-sdk = { path = "../gadget-sdk" }
url = "2"
addr = "0.15"
serde = { version = "1.0.229", features = ["derive"] }

[lib]
crate-type = ["cdylib"]
