# Gadgets included in release bundles.
#
# The `stage-bundled-gadgets` recipe reads this list, rebuilds
# each listed gadget via `just build-gadget <name>`, and copies
# the resulting `.torchsnap` archive into
# `target/bundled-gadgets/` where Tauri picks it up as a
# resource. Anything missing from this list never ships in the
# bundle — even if it sits under `gadgets/` and builds cleanly.
#
# Each entry must match a subdirectory of `gadgets/`. IDs are
# listed one-per-line (trailing comma allowed) so that adding
# or removing a gadget produces a clean, one-line diff.
gadgets = [
    "calculator",
    "emoji-picker",
    "bangs",
    "open-url",
    "zerotier",
]
