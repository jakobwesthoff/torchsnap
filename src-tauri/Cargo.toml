[package]
name = "torchsnap"
version = "0.10.0"
description = "torchsnap"
authors = ["Jakob Westhoff <jakob@westhoffswelt.de> (https://westhoffswelt.de)"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "torchsnap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
    "protocol-asset",
    "tray-icon",
    "image-png",
    "macos-private-api",
] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
anyhow = "1"
serde = { version = "1.0.228", features = ["derive"] }
nucleo-matcher = "0.3.1"
plist = "1.8.0"
blake3 = "1.8.3"
tauri-plugin-clipboard-manager = "2.3.2"
serde_json = "1.0.149"
image = { version = "0.25.10", features = [
    "webp",
    "ico",
    "png",
], default-features = false }
tauri-plugin-os = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
clipboard-rs = "0.3.3"
ulid = "3.0"
tokio = { version = "1.50.0", default-features = false, features = [
    "sync",
    "time",
    "net",
    "io-util",
    "process",
    "rt",
] }
tauri-plugin-autostart = "2.5.1"
evalexpr = "13.1.0"
regex = "1.12.3"
unicode-segmentation = "1.13"
reqwest = { version = "0.13.2", default-features = false, features = [
    "rustls",
    "json",
    "http2",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
] }
urlencoding = "2.1.3"
scraper = "0.27"
infer = "0.22"
thiserror = "2"
base64 = "0.23"
percent-encoding = "2"
url = "2"
addr = "0.15"
toml = "1.1.2"
# `default-features = false` drops wasmtime's `gc`, `gc-copying`,
# `gc-drc` and `gc-null` features along with the rest. Gadgets are
# Rust compiled to `wasm32-wasip2` and hold their state in linear
# memory, so no collector is needed; component-model `resource`
# handles live in the host's ResourceTable, not in a GC heap. With
# `gc` off, wasmtime disables the GC wasm features outright and
# rejects any component that uses them.
wasmtime = { version = "49.0", features = [
    "component-model",
    "winch",
], default-features = false }
wasmtime-wasi = { version = "49.0", default-features = false, features = ["p2"] }
zip = { version = "8.5.0", default-features = false, features = ["deflate"] }
cron = "0.17"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
tauri-plugin-dialog = "2.7.0"
globset = "0.4.18"
semver = "1.0.28"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"
objc2-app-kit = { version = "0.3.2", features = [
    "NSPasteboard",
    "NSWindow",
    "NSWorkspace",
    "NSImage",
    "NSGraphicsContext",
    "NSImageRep",
    "objc2-core-graphics",
] }
objc2-core-graphics = { version = "0.3.2", features = [
    "CGImage",
    "CGColorSpace",
    "CGContext",
    "CGBitmapContext",
], default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", features = [
    "NSString",
    "NSData",
    "NSGeometry",
    "NSURL",
] }

[target."cfg(unix)".dependencies]
libc = "0.2.186"

[profile.release]
strip = true
#lto = true

[dev-dependencies]
httpmock = "0.8.3"
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"
tokio = { version = "1.50.0", features = ["macros", "rt"] }
