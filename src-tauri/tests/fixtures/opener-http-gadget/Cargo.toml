[package]
name = "torchsnap-test-opener-http-gadget"
version = "0.0.0"
edition = "2024"
publish = false

# Test-only fixture crate. Targets wasm32-wasip2 and is built via the
# `just build-test-fixtures` recipe. Not part of any workspace; not
# compiled by `cargo test` — the committed `opener_http_gadget.wasm`
# artifact alongside this Cargo.toml is the canonical test input.

[dependencies]
wit-bindgen = "0.54"

[lib]
crate-type = ["cdylib"]
