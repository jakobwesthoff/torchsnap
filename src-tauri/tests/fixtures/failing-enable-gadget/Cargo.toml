[package]
name = "torchsnap-test-failing-enable-gadget"
version = "0.0.0"
edition = "2024"
publish = false

# Test-only fixture crate. Targets wasm32-wasip2 and is built via the
# `just build-test-fixtures` recipe. Variant of `minimal-gadget` whose
# guest `lifecycle::enable` panics — used to exercise the bridge's
# drop-instance-on-guest-enable-failure path.

[dependencies]
wit-bindgen = "0.60"

[lib]
crate-type = ["cdylib"]
