[plugin]
id = "command-plugin"
name = "Command Test Plugin"
description = "Test-only fixture exercising the `command` host interface"
version = "0.0.0"
wasm = "command_plugin.wasm"
icon = "heroicons:beaker"

# Allow `/bin/echo` with any single argv element. The fixture's
# `handle-message` dispatches to this rule for the happy-path
# tests (rule-allowed call returns captured stdout) and the
# permission-denied test (call with a binary not in any rule).
[[permissions.command]]
binary = "/bin/echo"
argv = [{ kind = "any-string" }]

# `/bin/sh -c <script>` for the slower / output-overflow tests.
# Argv constraint is `any-string` so the host doesn't reject the
# call before it gets a chance to time out or overflow.
[[permissions.command]]
binary = "/bin/sh"
argv = [
    { kind = "literal", value = "-c" },
    { kind = "any-string" },
]
