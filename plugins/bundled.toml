# Plugins included in release bundles.
#
# The `stage-bundled-plugins` recipe reads this list, rebuilds
# each listed plugin via `just build-plugin <name>`, and copies
# the resulting `.torchsnap` archive into
# `target/bundled-plugins/` where Tauri picks it up as a
# resource. Anything missing from this list never ships in the
# bundle — even if it sits under `plugins/` and builds cleanly.
#
# Each entry must match a subdirectory of `plugins/`. IDs are
# listed one-per-line (trailing comma allowed) so that adding
# or removing a plugin produces a clean, one-line diff.
plugins = [
    "calculator",
    "emoji-picker",
]
