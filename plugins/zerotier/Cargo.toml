[package]
name = "zerotier-gadget"
version = "0.1.0"
edition = "2024"

# This crate targets wasm32-wasip2 and is built with
# `cargo build --target wasm32-wasip2`, not the host target.

[dependencies]
torchsnap-gadget-sdk = { path = "../plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
# Pin to the host's exact version so fuzzy match scoring is
# consistent between this plugin and the host catalog matcher.
nucleo-matcher = "=0.3.1"
thiserror = "2"

[lib]
crate-type = ["cdylib"]
