[package]
name = "emoji-picker-gadget"
version = "0.1.0"
edition = "2024"

# This crate targets wasm32-wasip2 and is built with
# `cargo build --target wasm32-wasip2`, not the host target.

[dependencies]
torchsnap-gadget-sdk = { path = "../plugin-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
# Match the host's nucleo-matcher version so scoring behaviour
# stays identical across the WIT boundary (the host also uses
# nucleo for catalog matching).
nucleo-matcher = "0.3.1"

[lib]
crate-type = ["cdylib"]
