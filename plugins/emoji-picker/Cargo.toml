[package]
name = "emoji-picker-plugin"
version = "0.1.0"
edition = "2024"

# This crate targets wasm32-wasip2 and is built with
# `cargo build --target wasm32-wasip2`, not the host target.

[dependencies]
wit-bindgen = "0.54"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
# Match the host's nucleo-matcher version so scoring behaviour
# stays identical across the WIT boundary (the host also uses
# nucleo for catalog matching).
nucleo-matcher = "0.3.1"

[lib]
crate-type = ["cdylib"]

# Release profile tuned for WASM component plugins.
# See `plugins/hello-world/Cargo.toml` for rationale behind
# each setting — the trade-offs apply identically here.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
